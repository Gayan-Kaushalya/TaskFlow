name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # =======================================================
  # 1. LINT (Code & IaC)
  # =======================================================
  lint:
    name: 1. Lint (Code & IaC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Linters & App Deps
        run: |
          pip install flake8 black
          pip install -r app/requirements.txt

      - name: Run Black & Flake8
        run: |
          black --check app/
          flake8 app/ --max-line-length=120

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Ansible Lint
        uses: ansible/ansible-lint@main
        with:
          requirements_file: "ansible/requirements.yml"
          args: "ansible/site.yml"

  # =======================================================
  # 2. SECURITY (Gitleaks & Trivy)
  # =======================================================
  security:
    name: 2. Security & Vulnerability Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: IaC Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # =======================================================
  # 3. TEST (Pytest Coverage Gate >= 70%)
  # =======================================================
  test:
    name: 3. Unit Tests & Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Test Dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Pytest with 70% Coverage Gate
        env:
          PYTHONPATH: .
        run: |
          pytest app/tests/ -v --cov=app/src --cov-report=term-missing --cov-fail-under=70

  # =======================================================
  # 4. BUILD & PUSH (Docker & ECR)
  # =======================================================
  build-and-push:
    name: 4. Build & Push Docker Image
    needs: [lint, security, test]
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short SHA Output
        id: vars
        run: echo "sha_short=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: taskflow-app
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest app/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # =======================================================
  # 5. PLAN (Terraform)
  # =======================================================
  plan:
    name: 5. Terraform Plan
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Init & Plan
        working-directory: terraform/envs/prod
        run: |
          terraform init
          terraform plan -no-color -var="app_image=${{ needs.build-and-push.outputs.ecr_registry }}/taskflow-app:${{ needs.build-and-push.outputs.image_tag }}"

  # =======================================================
  # 6. APPLY (Terraform - Manual Gate via 'production')
  # =======================================================
  terraform-apply:
    name: 6. Terraform Apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [plan, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      alb_dns_name: ${{ steps.tf-outputs.outputs.alb_dns }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Init & Apply
        working-directory: terraform/envs/prod
        run: |
          terraform init
          terraform apply -auto-approve -var="app_image=${{ needs.build-and-push.outputs.ecr_registry }}/taskflow-app:${{ needs.build-and-push.outputs.image_tag }}"

      - name: Get Terraform Outputs
        id: tf-outputs
        working-directory: terraform/envs/prod
        run: |
          echo "alb_dns=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT

  # =======================================================
  # 7. CONFIGURE (Ansible Host Hardening)
  # =======================================================
  configure:
    name: 7. Configure Hosts (Ansible)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [terraform-apply]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Python & Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Session Manager Plugin & Ansible
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws community.general community.aws ansible.posix

      - name: Wait for SSM Agent Registration
        run: |
          echo "Waiting 30 seconds for EC2 instances to register with AWS SSM..."
          sleep 30

      - name: Set up SSH Key & Authorize via EC2 Instance Connect
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=taskflow-ecs-node" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          for INSTANCE_ID in $INSTANCE_IDS; do
            AZ=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" --query "Reservations[0].Instances[0].Placement.AvailabilityZone" --output text)
            echo "Authorizing SSH key for $INSTANCE_ID in $AZ..."
            aws ec2-instance-connect send-ssh-public-key \
              --instance-id "$INSTANCE_ID" \
              --instance-os-user ec2-user \
              --availability-zone "$AZ" \
              --ssh-public-key file://~/.ssh/id_rsa.pub
          done

      - name: Run Ansible Playbook (Initial Execution)
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook -i ansible/inventory/aws_ec2.yml ansible/site.yml --private-key ~/.ssh/id_rsa

      - name: Run Ansible Playbook (Idempotency Check - Expect changed=0)
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook -i ansible/inventory/aws_ec2.yml ansible/site.yml --private-key ~/.ssh/id_rsa

  # =======================================================
  # 8. DEPLOY (ECS Service Force Deployment)
  # =======================================================
  deploy:
    name: 8. ECS Service Deployment
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [configure]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Force ECS Service New Deployment
        run: |
          aws ecs update-service --cluster taskflow-cluster --service taskflow-service --force-new-deployment
          aws ecs wait services-stable --cluster taskflow-cluster --services taskflow-service

  # =======================================================
  # 9. SMOKE TEST (ALB /health)
  # =======================================================
  smoke-test:
    name: 9. Smoke Test ALB /health
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [terraform-apply, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Query Live Health Endpoint
        run: |
          ALB_URL="http://${{ needs.terraform-apply.outputs.alb_dns_name }}/health"
          echo "Testing health check at $ALB_URL"
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ALB_URL" || true)
            if [ "$STATUS" -eq 200 ]; then
              echo "Smoke test PASSED with HTTP 200"
              exit 0
            fi
            echo "Attempt $i: Received HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test FAILED - ALB did not return HTTP 200 in time"
          exit 1
